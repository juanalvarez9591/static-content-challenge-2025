name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit, functional and integration tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: End to end tests
        run: npm run test:e2e
